<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <h1>List in html</h1>
    
    <h2>Unordered list</h2>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>BS</li>
    </ul>

    <h2>Ordered list</h2>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>BS</li>
    </ol>
</body>
</html>
