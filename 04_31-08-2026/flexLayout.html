<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex layout</title>
    <style>
      html{
        margin: 0;
        padding: 0;
      }

      body{
        background-color: rgb(246, 202, 144);
      }

      main{
        width: 960px;
        height: 1000px;
        background-color: beige;
        margin: 0 auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }   

      header{
        width: 960px;
        height: 80px;
        background-color: #CCC;
      }

      nav{
        width: 960px;
        height: 100px;
        background-color: #CCC;
      }

      section{
        width: 960px;
        height: 400px;
        display: flex;
        flex-direction: row;
        column-gap: 10px;
      }

      #left{
        flex-grow: 1;
        background-color: #CCC;
      }

      #right{
        flex-grow: 2;
        background-color: #CCC;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      aside, article{
        background-color: #CCC;
        flex-grow: 1;
      }

      footer{
        width: 960px;
        height: 300px;
        background-color: #CCC;
      }
    </style>
</head>
<body>
    <main>
        <header>
            <h2>Header</h2>
        </header>

        <nav>
            <h2>Navbar</h2>
        </nav>

        <section>
            <div id="left">

            </div>

            <div id="right">
                <aside>
                    <h2>Aside</h2>
                </aside>
                <article>
                    <h2>Article</h2>
                </article>
            </div>
        </section>

        <footer>
            <h2>Footer</h2>
        </footer>
    </main>
</body>
</html>
